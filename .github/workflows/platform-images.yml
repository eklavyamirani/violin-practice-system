# Platform v2 (eklavyamirani/app-platform, record 0035): build violin's
# images and push them to the platform's Azure Container Registry, tagged by
# commit SHA. Argo CD on the cluster pulls them; this workflow never holds
# cluster credentials. Azure login is OIDC federation (no stored secrets);
# the federated credential only trusts this repository's main branch and
# its own (non-fork) pull requests. Generated by scripts/new-app.
#
# Repository variables (set once by the owner): PLAT2_AZURE_CLIENT_ID
# (scripts/tf output -raw apps_ci_client_id), PLAT2_AZURE_TENANT_ID,
# PLAT2_AZURE_SUBSCRIPTION_ID, PLAT2_ACR_NAME.
name: Platform v2 images

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  id-token: write

concurrency:
  group: platform-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  images:
    # Skipped until the owner sets the PLAT2_* variables (app-platform record
    # 0042). PRs get images only with the "preview" label, only from this repo.
    if: >-
      vars.PLAT2_ACR_NAME != '' && (github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'preview')))
    runs-on: ubuntu-24.04
    env:
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.PLAT2_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.PLAT2_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.PLAT2_AZURE_SUBSCRIPTION_ID }}
      - run: az acr login --name "${{ vars.PLAT2_ACR_NAME }}"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Web first, database last: the platform runs migrations from the
      # violin-db image before it rolls out, so a release starts only after
      # both images exist.
      - name: Web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          provenance: mode=max
          tags: ${{ vars.PLAT2_ACR_NAME }}.azurecr.io/violin-web:${{ env.SHA }}
      - name: Database image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: db
          file: db/Dockerfile
          push: true
          provenance: mode=max
          tags: ${{ vars.PLAT2_ACR_NAME }}.azurecr.io/violin-db:${{ env.SHA }}
