# Platform v2 (eklavyamirani/app-platform, record 0059): clean up after a
# Product Scout prototype once its preview is gone. app-platform removes an
# expired preview from the cluster but cannot write to this repository, so
# this job, with this repository's own GITHUB_TOKEN only, every two hours:
#   - for each open pull request labelled "prototype" (never any other PR):
#     - preview live (public status endpoint answers 200): makes sure the PR
#       has a GitHub deployment "violin-pr-<n>" with the preview's URL
#     - preview gone (404) after it had a deployment (expired, or closed with
#       scripts/preview --close): marks the deployment inactive, deletes the
#       PR's images from ghcr.io (versions tagged with one of the PR's own
#       commits that is not on the default branch), closes the PR with a
#       comment and deletes its branch
#     - a promoted preview stays live, so nothing happens to its PR
# No Azure or cluster access; the status endpoint is public (record 0033).
# Generated by scripts/new-app from templates/new-app/preview-cleanup.yml.
name: Prototype cleanup

on:
  schedule:
    - cron: "41 */2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only report what would be cleaned up
        type: boolean
        default: false

permissions: {}

concurrency:
  group: prototype-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write        # delete a prototype's branch
      pull-requests: write   # comment on and close a prototype PR
      issues: read           # read its labels
      packages: write        # delete its image versions (this repository's packages)
      deployments: write     # its preview deployment (URL on the PR; inactive when gone)
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
      APP: violin
      STATUS_URL: https://previews.app.ekkylab.uk/api/status
      IMAGES: violin-web violin-db
      LABEL: prototype
    steps:
      - name: Clean up prototypes whose preview is gone
        shell: bash
        run: |
          set -euo pipefail
          run() { if [[ $DRY_RUN == true ]]; then echo "  (dry run) $*"; else "$@"; fi; }
          owner_kind=$(gh api "users/$OWNER" --jq '.type | ascii_downcase | if . == "organization" then "orgs" else "users" end')
          # "<id> <digest> <tag,tag,...>" for every version of an image (this repository's package).
          versions() {
            gh api --paginate "$owner_kind/$OWNER/packages/container/$1/versions" \
              --jq '.[] | "\(.id) \(.name) \(.metadata.container.tags | join(","))"'
          }
          # Child manifests (platforms, build attestations) of an image index, from the registry.
          children() {
            local tok
            tok=$(curl -fsS "https://ghcr.io/token?scope=repository:$OWNER/$1:pull&service=ghcr.io" | jq -r .token) || return 0
            curl -fsS -H "Authorization: Bearer $tok" \
              -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" \
              "https://ghcr.io/v2/$OWNER/$1/manifests/$2" 2>/dev/null | jq -r '.manifests[]?.digest' || true
          }
          delete_images() { # delete_images <pr>: versions tagged with the PR's own commits, not on the default branch
            local pr=$1 sha img all d id shas=() digests
            for sha in $(gh api --paginate "repos/$REPO/pulls/$pr/commits" --jq '.[].sha'); do
              # A commit that is also on the default branch has main's images under the same tag.
              case $(gh api "repos/$REPO/compare/$DEFAULT_BRANCH...$sha" --jq .status) in
                behind|identical) echo "  ${sha:0:12} is on $DEFAULT_BRANCH: its images stay" ;;
                *) shas+=("$sha") ;;
              esac
            done
            ((${#shas[@]})) || { echo "  no commits of its own: no images to delete"; return 0; }
            for img in $IMAGES; do
              all=$(versions "$img") || { echo "  could not list $img versions: images left in place"; continue; }
              # The tagged image, its attestation (tag sha256-<hex>), and their child manifests.
              digests=$(for sha in "${shas[@]}"; do awk -v t="$sha" '{ n = split($3, a, ","); for (i = 1; i <= n; i++) if (a[i] == t) print $2 }' <<<"$all"; done)
              digests+=$'\n'$(for d in $digests; do awk -v t="sha256-${d#sha256:}" '{ n = split($3, a, ","); for (i = 1; i <= n; i++) if (a[i] == t) print $2 }' <<<"$all"; done)
              for d in $digests; do children "$img" "$d"; echo "$d"; done | sort -u | while read -r d; do
                [[ -n $d ]] || continue
                id=$(awk -v d="$d" '$2 == d { print $1; exit }' <<<"$all")
                [[ -n $id ]] || continue
                echo "  delete $img ${d:0:19}… (version $id)"
                run gh api -X DELETE "$owner_kind/$OWNER/packages/container/$img/versions/$id" >/dev/null || echo "  could not delete $img version $id"
              done
            done
          }
          gh pr list --repo "$REPO" --state open --label "$LABEL" --limit 100 \
            --json number,headRefName,headRefOid,isCrossRepository --jq '.[] | "\(.number) \(.headRefName) \(.headRefOid) \(.isCrossRepository)"' |
          while read -r pr branch head cross; do
            env="$APP-pr-$pr"
            code=$(curl -sS -o status.json -w '%{http_code}' --max-time 20 "https://previews.app.ekkylab.uk/api/status/$env" || echo 000)
            deps=$(gh api "repos/$REPO/deployments?environment=$env&per_page=100" --jq '.[].id')
            echo "PR #$pr ($branch @ ${head:0:12}): preview $env answers $code; deployments: ${deps:-none}"
            case $code in
              200)
                url=$(jq -r .url status.json) sha=$(jq -r .sha status.json)
                echo "  live at $sha, expires $(jq -r '.expires // ""' status.json), promoted $(jq -r '.promoted // false' status.json)"
                [[ $sha =~ ^[0-9a-f]{40}$ && $url == https://* ]] || { echo "  unexpected status; skipped"; continue; }
                if [[ -z $(gh api "repos/$REPO/deployments?environment=$env&sha=$sha" --jq '.[0].id // empty') ]]; then
                  echo "  record deployment $env at ${sha:0:12} -> $url"
                  if [[ $DRY_RUN != true ]]; then
                    id=$(jq -n --arg ref "$sha" --arg env "$env" '{ref: $ref, environment: $env, auto_merge: false,
                        transient_environment: true, required_contexts: [], description: "Product Scout preview (app-platform)"}' |
                      gh api -X POST "repos/$REPO/deployments" --input - --jq .id)
                    gh api -X POST "repos/$REPO/deployments/$id/statuses" -f state=success -f environment_url="$url" \
                      -f description="Preview live" >/dev/null
                  fi
                fi
                ;;
              404)
                [[ -n $deps ]] || { echo "  never had a preview: left alone"; continue; }
                echo "  preview gone: cleaning up"
                for id in $deps; do run gh api -X POST "repos/$REPO/deployments/$id/statuses" -f state=inactive -f description="Preview removed" >/dev/null; done
                delete_images "$pr"
                run gh pr close "$pr" --repo "$REPO" --comment "The preview of this prototype is gone (it expired or was closed in app-platform), so this prototype PR is closed and its branch and images are deleted (app-platform record 0059). The commits stay reachable from this PR; reopen it to continue."
                if [[ $cross == false && $branch != "$DEFAULT_BRANCH" ]]; then
                  run gh api -X DELETE "repos/$REPO/git/refs/heads/$branch" >/dev/null || echo "  could not delete branch $branch"
                fi
                ;;
              *) echo "  status endpoint unavailable ($code): skipped this run" ;;
            esac
          done
