# Changes with each deploy: the page, scripts and config are revalidated.
map $uri $violin_cache {
  ~\.(html|js|json)$  "no-cache";
  default             "";
}

server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;

  location = /health { access_log off; default_type text/plain; return 200 "ok\n"; }
  location / { try_files $uri $uri/ =404; }

  add_header Cache-Control $violin_cache;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  # The microphone is the app's purpose; nothing else is needed.
  add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
}
